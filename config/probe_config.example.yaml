# config/probe_config.example.yaml
# 探针小号与专用代理配置模板（与主发布大号绝对物理隔离）
# 生产使用时复制为 config/probe_config.yaml 并填入探针凭证（已在 .gitignore 中忽略）

twitter_probe:
  enabled: false
  auth_token: ""        # 探针账号 auth_token (支持从环境变量 TWITTER_AUTH_TOKEN 读取)
  ct0: ""               # 探针账号 ct0 凭据 (支持从环境变量 TWITTER_CT0 读取)
  proxy_url: ""         # 海外访问代理，例如: http://127.0.0.1:7890 (支持从 TWITTER_PROXY 读取)
