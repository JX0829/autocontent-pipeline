accounts:
  - id: "douyin-tech-main"
    platform: "douyin"
    name: "程序员科技热点"
    account_type: "tech"
    profile_path: "./data/browser_profiles/douyin-tech"
    proxy_server: ""                 # 留空则直连；生产环境填入 http://user:***@host:port
    fingerprint_seed: "fp_seed_894102_mac_m3"
    publish_mode: "public_publish"   # 公开发布（原 private_publish 仅自己可见已切公开）；可见性由 provider 勾选「公开可见」，找不到选项即 fail-closed
    schedule_delay_minutes: 120
    declare_aigc: true
    max_daily_tasks: 4
    private_domain_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，评论区AI已接入，欢迎交流～"
    seed_comment:                    # 发布后自动发作者首评（漏掉的字段，2026-11-10 补齐）
      enabled: true                  # 开：发布成功后自动发首评
      pin: true                     # 能置顶就置顶（首屏默认可见）；平台不支持则降级为普通首评
      text: ""                       # 留空则用 video_desc 前 120 字 + 欢迎语
    enabled: true

  - id: "douyin-news-fast"
    platform: "douyin"
    name: "前沿快讯精选"
    account_type: "news"
    profile_path: "./data/browser_profiles/douyin-news"
    proxy_server: ""
    fingerprint_seed: "fp_seed_331904_win_rtx"
    publish_mode: "scheduled_publish"
    schedule_delay_minutes: 90
    declare_aigc: true
    max_daily_tasks: 3
    private_domain_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，评论区AI已接入，欢迎交流～"
    enabled: false

