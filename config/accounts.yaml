    platform: "douyin"
    name: "程序员科技热点"
    account_type: "tech"
    profile_path: "./data/browser_profiles/douyin-tech"
    proxy_server: ""                 # 留空则直连；生产环境填入 http://user:***@host:port
    fingerprint_seed: "fp_seed_894102_mac_m3"
    publish_mode: "private_publish"  # 方案A：发布为仅自己可见（私密作品），双端100%立即可见，绝对不公开扩散
