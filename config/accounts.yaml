  - id: "bili-tech-main"
    platform: "bilibili"
    name: "B站科技号"
    account_type: "tech"
    profile_path: "./data/browser_profiles/bilibili-tech"
    publish_mode: "public"            # 公开发布（原 only_self_visible 已切公开）
    tid: 231                         # 科技 -> 计算机技术分区
    declare_aigc: true
    # ⛔ 2026-11-10 下线：与 bilibili-tech-main 重复（同平台同账号类型）。
    #    该账号没有 mid / cookie_path，活代码只认 bilibili-tech-main
    #    （scripts/bilibili_live_uploader.py:139 按 id 精确匹配）。
    #    两个都 enabled 会让审批卡片列两行 B站、发布时发两次。保留记录不删除。
