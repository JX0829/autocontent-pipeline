    declare_aigc: false              # 与 channels-tech 一致：Web 端无 AI 声明控件
    declare_original: true
    max_daily_tasks: 3
    seed_comment:
      enabled: true
      pin: true
      text: ""
    enabled: false                   # 待账号资质 + 浏览器 profile 就绪

