# ============================================================================
# AutoContent Pipeline · 可扩展多模板注册与路由配置
# 支持通过 CLI (--template)、Payload 字段 (template_id)、账号配置或按 round_robin 轮换
# ============================================================================

# 【2026-11-17】必须写成具体模板名，不能留 round_robin：
# resolve_template_id() 里 round_robin 分支优先于 theme_mapping，
# 留 round_robin 会导致 theme_mapping 里的 tech_story 永远不生效（实测踩过）。
# 回滚轮换：改回 "round_robin"（此时以 round_robin_sequence 为准，tech_story 不参与）
default_template: "tech_story"

# 轮换执行队列顺序（T1 -> T2 -> T3 -> T4 -> T5 -> T1 ...）
round_robin_sequence:
  - "editorial_news"   # T1 · 瑞士先锋报刊风
  - "cupertino_glass"  # T2 · Apple 毛玻璃流光风
  - "neo_brutalism"    # T3 · 多巴胺波普粗野风
  - "notion_craft"     # T4 · Notion 暖调手账风
  - "linear_obsidian"  # T5 · Linear 钛黑流光风

# 当 template_id 为 "auto" 且未开启轮换时，根据 DraftScriptPayload.theme 自动匹配最贴合的模板
# 【2026-11-17 切换】科技类改用全屏 AI 视频模板 tech_story。
# 回滚：把下面三行还原成注释里的旧映射即可（editorial_news / cupertino_glass / notion_craft）
theme_mapping:
  breaking-news: "tech_story"
  ai-product: "tech_story"
  tech-github: "tech_story"
  # breaking-news: "editorial_news"
  # ai-product: "cupertino_glass"
  # tech-github: "notion_craft"

# 内置 5 套默认视觉模板元数据（供 CLI、飞书审批卡片下拉菜单及校验器读取）
templates:
  tech_story:
    name: "T6 · 科技全屏视频（AI 素材 + 口播）"
    description: "全屏 AI 视频素材铺底 + 顶部标题/关键词 + 底部字幕 + 舒缓 BGM；文字不遮画面中部"
    recommended_themes: ["breaking-news", "ai-product", "tech-github"]
    enabled: true
    composition: "TechStoryVideo"

  editorial_news:
    # ⛔ 2026-11-18 退休：T1 瑞士报刊风（旧 GeekShortVideo 排版模板，用户要求下线）
    retired: true
    name: "T1 · 瑞士先锋报刊风 (Editorial Paper)"
    description: "暖米白羊皮纸底色 + 国际朱砂红重点色 + 粗黑社论衬线标题 + 3px 严谨网格线"
    recommended_themes: ["breaking-news", "tech-github"]
    enabled: false

  cupertino_glass:
    # ⛔ 2026-11-18 退休：T2 Apple 毛玻璃（旧 GeekShortVideo 排版模板，用户要求下线）
    retired: true
    name: "T2 · Apple 毛玻璃流光风 (Cupertino Glass)"
    description: "深空午夜蓝极光流体渐变 + VisionOS 高透磨砂玻璃 + Bento 便当盒 36px 大圆角"
    recommended_themes: ["ai-product"]
    enabled: false

  neo_brutalism:
    # ⛔ 2026-11-18 退休：T3 波普粗野（旧 GeekShortVideo 排版模板，用户要求下线）
    retired: true
    name: "T3 · 多巴胺波普粗野风 (Neo-Brutalism Pop)"
    description: "高明度柠檬黄底色 + 电光紫/糖果粉/薄荷绿撞色 + 4px 纯黑描边与 12px 硬朗错位阴影"
    recommended_themes: ["ai-product", "breaking-news", "tech-github"]
    enabled: false

  notion_craft:
    # ⛔ 2026-11-18 退休：T4 Notion 手账（旧 GeekShortVideo 排版模板，用户要求下线）
    retired: true
    name: "T4 · Notion 暖调手账风 (Notion Warm Craft)"
    description: "护眼燕麦奶白点阵纸 + 森林鼠尾草绿 + 暖黄荧光笔半透明涂抹高亮 + Callout 笔记块"
    recommended_themes: ["tech-github", "ai-product"]
    enabled: false

  linear_obsidian:
    # ⛔ 2026-11-18 退休：T5 Linear 钛黑（旧 GeekShortVideo 排版模板，用户要求下线）
    retired: true
    name: "T5 · Linear 钛黑流光风 (Linear Obsidian)"
    description: "深曜石黑底色 + 顶部星云聚光灯 + 1px 钛金属微光渐变切线 + 冰蓝与极光紫双色"
    recommended_themes: ["tech-github"]
    enabled: false
