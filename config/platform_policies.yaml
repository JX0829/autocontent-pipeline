# config/platform_policies.yaml
# 多平台差异化风控与互动策略配置中心

platforms:
  xiaohongshu:
    display_name: "小红书"
    # 文本与视觉呈现策略
    text_policy:
      footer_callout: "💡 欢迎评论区交流"
      seed_comment_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，欢迎评论区交流～"
      max_title_chars: 20
      filter_ai_keywords: true
      declare_aigc: false

    # 评论与互动策略
    interaction_policy:
      reply_mode: "manual_approval"      # 严格模式：仅生成建议话术推送到飞书，由人工在手机App端复制回复
      allow_direct_api_reply: false     # 严禁脚本/CDP直接写回
      enable_background_polling: false  # 暂停高频自动扫号

  douyin:
    display_name: "抖音"
    text_policy:
      footer_callout: "💡 评论区AI回复，欢迎交流"
      seed_comment_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，评论区AI已接入，欢迎交流～"
      max_title_chars: 30
      filter_ai_keywords: false
      declare_aigc: true

    interaction_policy:
      reply_mode: "auto_direct_reply"    # 抖音平台：允许 AI 自动审查并自动直发
      allow_direct_api_reply: true
      enable_background_polling: true

  default:
    display_name: "默认平台"
    text_policy:
      footer_callout: "💡 欢迎评论区交流"
      seed_comment_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，欢迎评论区交流～"
      max_title_chars: 30
      filter_ai_keywords: false
      declare_aigc: false

    interaction_policy:
      reply_mode: "manual_approval"
      allow_direct_api_reply: false
      enable_background_polling: false
