# config/platform_policies.yaml
# 多平台差异化文本与互动策略配置中心 (autocontent-pipeline)

platforms:
  xiaohongshu:
    display_name: "小红书"
    freeze_until: "2026-11-06"
    status: "frozen_for_safety"          # 7天冷冻静默期（至2026-11-06）：严禁API/脚本直发与高频轮询，成片人工手机发布
    text_policy:
      footer_callout: "💡 欢迎评论区交流"
      seed_comment_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，欢迎评论区交流～"
      max_title_chars: 20                  # 小红书 MCP 发布工具硬校验 <= 20 字符
      filter_ai_keywords: true             # 严格过滤“AI回复/自动回复/脚本”等敏感词
      declare_aigc: false
    interaction_policy:
      reply_mode: "manual_approval"        # 严格人工闭环：仅生成拟稿并推送到飞书，由人工在手机App端手动回复
      allow_direct_api_reply: false       # 严禁脚本直接调用 API / CDP 回复
      enable_background_polling: false    # 7天冷冻期彻底关闭后台轮询（防风控机器检测）

  douyin:
    display_name: "抖音"
    text_policy:
      footer_callout: "💡 评论区AI回复，欢迎交流"
      seed_comment_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，评论区AI已接入，欢迎交流～"
      max_title_chars: 30
      filter_ai_keywords: false
      declare_aigc: true
    interaction_policy:
      reply_mode: "auto_direct_reply"      # 抖音平台：保留 AI 自动审查并自动直发回复
      allow_direct_api_reply: true
      enable_background_polling: true

  default:
    display_name: "默认通用平台"
    text_policy:
      footer_callout: "💡 欢迎评论区交流"
      seed_comment_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，欢迎评论区交流～"
      max_title_chars: 30
      filter_ai_keywords: false
      declare_aigc: false
    interaction_policy:
      reply_mode: "manual_approval"
      allow_direct_api_reply: false
      enable_background_polling: false
