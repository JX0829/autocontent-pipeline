# config/platform_policies.yaml
# 多平台差异化文本与互动策略配置中心 (autocontent-pipeline)

platforms:
  # ⛔ 小红书（xiaohongshu）已于 2026-11-09 彻底下线：账号被封禁，
  #    相关 provider / 巡检 / 登录脚本 / 策略 / 账号配置已全部移除（备份见 backup/xhs_removed_*）。

  douyin:
    display_name: "抖音"
    text_policy:
      footer_callout: "💡 评论区AI回复，欢迎交流"
      seed_comment_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，评论区AI已接入，欢迎交流～"
      max_title_chars: 30
      filter_ai_keywords: false
      declare_aigc: true
    interaction_policy:
      reply_mode: "auto_direct_reply"      # 抖音平台：保留 AI 自动审查并自动直发回复
      allow_direct_api_reply: true
      enable_background_polling: true

  bilibili:
    display_name: "哔哩哔哩"
    text_policy:
      footer_callout: "💡 源码与项目见简介与置顶评论"
      seed_comment_hook: "项目完整开源地址已整理，欢迎在评论区与弹幕交流探讨！"
      max_title_chars: 80
      filter_ai_keywords: false
      declare_aigc: true
    interaction_policy:
      reply_mode: "auto_direct_reply"       # B站平台：开启 AI 审查并通过官方 REST API 自动直发回复
      allow_direct_api_reply: true
      enable_background_polling: true

  channels:
    display_name: "微信视频号"
    text_policy:
      footer_callout: "💡 欢迎在评论区交流讨论"
      seed_comment_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，欢迎交流～"
      max_title_chars: 30
      filter_ai_keywords: true
      declare_aigc: false
    interaction_policy:
      reply_mode: "manual_approval"        # 方案 A：AI拟写建议 + 飞书卡片推送到手机端一键复制，0风险
      allow_direct_api_reply: false       # 严禁任何 CDP 纯自动化机械模拟写入
      enable_background_polling: true     # 启用后台无感抓取与建议拟写通知

  default:
    display_name: "默认通用平台"
    text_policy:
      footer_callout: "💡 欢迎评论区交流"
      seed_comment_hook: "开源项目直接在 GitHub 搜索对应项目名即可查看源码，欢迎评论区交流～"
      max_title_chars: 30
      filter_ai_keywords: false
      declare_aigc: false
    interaction_policy:
      reply_mode: "manual_approval"
      allow_direct_api_reply: false
      enable_background_polling: false
